<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <title>Contacto - Aura Fit</title>
   
    <link rel="stylesheet" href="estilos.css">
    

    <style>
        .contacto-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #1e293b;
            font-size: 14px;
        }
        
        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            box-sizing: border-box; 
        }
        
        .form-group textarea {
            height: 120px;
            resize: vertical; 
        }
        
        .btn-enviar {
            background-color: #38bdf8; 
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }
        
        .btn-enviar:hover {
            background-color: #0ea5e9; 
        }
        
        .info-adicional {
            margin-top: 30px;
            text-align: center;
            font-size: 13px;
            color: #64748b;
            border-top: 1px solid #e2e8f0;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    
    <div class="content-container">

    
        <div class="centro-contenido" style="text-align: center; margin-bottom: 30px;">
            <h2>Contáctanos</h2>
            <p>¿Tienes dudas sobre tallas, envíos o quieres hacernos un pedido especial? <br>Escríbenos y te responderemos lo antes posible.</p>
        </div>

      
        <div class="contacto-container">
            
          
            <form action="#" method="post">
                
             
                <div class="form-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: María Rodríguez" required>
                </div>
                
         
                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="maria.rodriguez@email.com" required>
                </div>
                
                
                <div class="form-group">
                    <label for="provincia">Provincia:</label>
                    <select id="provincia" name="provincia">
                        <option value="" disabled selected>Selecciona tu provincia</option>
                        <option value="sanjose">San José</option>
                        <option value="alajuela">Alajuela</option>
                        <option value="cartago">Cartago</option>
                        <option value="heredia">Heredia</option>
                        <option value="guanacaste">Guanacaste</option>
                        <option value="puntarenas">Puntarenas</option>
                        <option value="limon">Limón</option>
                    </select>
                </div>
                
              
                <div class="form-group">
                    <label for="mensaje">Tu Mensaje o Pedido:</label>
                    <textarea id="mensaje" name="mensaje" placeholder="Escribe aquí tus dudas o detalles del pedido..." required></textarea>
                </div>
                
              
                <button type="submit" class="btn-enviar">Enviar Mensaje</button>
                
            </form>
            
           
            <div class="info-adicional">
                <p>También puedes escribirnos por WhatsApp al: <b>+506 8888-8888</b></p>
                <p>O seguirnos en Instagram: <b>@aurafit.cr</b></p>
                <p>Hacemos envíos a todo Costa Rica por Correos de Costa Rica.</p>
            </div>
            
        </div>

    </div>

    <script>
        (function() {
            var params = new URLSearchParams(window.location.search);
            var producto = params.get("producto");
            var color = params.get("color");
            var talla = params.get("talla");
            var precio = params.get("precio");

            if (producto || color || talla || precio) {
                var campoMensaje = document.getElementById("mensaje");
                if (campoMensaje && !campoMensaje.value) {
                    campoMensaje.value =
                        "Hola, me gustaría solicitar información o cotizar la siguiente prenda:\n" +
                        "- Producto: " + (producto || "No especificado") + "\n" +
                        "- Color: " + (color || "No especificado") + "\n" +
                        "- Talla: " + (talla || "No especificado") + "\n" +
                        "- Precio de referencia: " + (precio || "Consultar");
                }
            }
        })();
    </script>

</body>
</html>
